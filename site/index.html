<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e9">
  <title>Дмитрий Щукин</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #191919; background: #f4f1e9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; }
    main { width: min(100%, 760px); padding: clamp(28px, 7vw, 72px); border: 1px solid #d9d5ca; background: #faf9f5; }
    .mark { margin: 0 0 56px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #68665f; }
    h1 { margin: 0; font-size: clamp(42px, 9vw, 88px); line-height: .98; font-weight: 500; letter-spacing: -.065em; }
    .intro { max-width: 520px; margin: 26px 0 0; font-size: clamp(18px, 2.7vw, 23px); line-height: 1.45; color: #55534d; }
    .status { margin: 64px 0 0; padding-top: 18px; border-top: 1px solid #d9d5ca; font-size: 13px; color: #77746c; }
  </style>
</head>
<body>
  <main>
    <p class="mark">dschkn.ru</p>
    <h1>Дмитрий<br>Щукин</h1>
    <p class="intro">Разрабатываю цифровые продукты и веб-приложения. Этот сайт скоро станет точкой входа в мои проекты и услуги.</p>
    <p class="status">Сайт в разработке</p>
  </main>
</body>
</html>
